# Unit tests for gbench itself.
#
# These never contact a model. The Golden Set tests stand up a fake
# in-process endpoint with scripted answers, so the suite is
# deterministic and safe to require for merge.
#
# The Golden Set eval under gbench/golden_dataset/ is deliberately NOT
# run here. It needs a live model, and its pass rate is a fact about
# that model rather than about this repo. Running it in CI would let a
# bad checkpoint in a consumer repo turn this repo's main red, and the
# eval's real audience would learn to ignore it. See tests/README.md.
#
# The install is the package with its declared dependencies and the
# `dev`, `evals` and `omnidocbench` extras (never --no-deps, never a
# hand-written list; `omnidocbench` holds the TEDS and edit-distance
# libraries of the in-process omnidocbench helpers the tests exercise),
# so a dependency the code imports but pyproject.toml does not declare
# fails here the way it would for a user. On top of that comes the one
# thing the unit tests import that gbench deliberately does not declare:
# transformers (the serving stack's tokenizer library; torch is pinned
# to its CPU build first so the install stays small). Harnesses whose
# own pins conflict with gbench's run in local images and are not
# installed here (tau2-bench, Harbor for terminal_bench): their unit
# tests stub those images, and the few tests that run one are opt-in
# (tests/README.md), since the runner's Docker daemon holds none of
# gbench's local images. The BFCL suites also run their harness in a
# local image (gbench-bfcl); the dev extra installs the same bfcl-eval
# release here only for the unit tests that run its checker functions
# in-process. The ci_skip_gate plugin then
# fails the run if any test skipped because a declared dependency is
# missing.

name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The runtime needs 3.11 or later (tomllib in the terminal_bench and
        # tau suites and in the tests).
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    # System tools the tests exercise and pyproject.toml cannot declare:
    # bubblewrap (acebench's isolated argument eval and the code sandbox;
    # Ubuntu 24.04 restricts the unprivileged user namespaces it needs
    # until the AppArmor switch below is off) and a Java runtime
    # (pycocoevalcap's tokenizer and METEOR). Docker is on the runner.
    - name: Install system tools
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q bubblewrap default-jre-headless
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        bwrap --unshare-all --ro-bind / / true

    - name: Install gbench with its declared dependencies and test extras
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -e ".[dev,evals,omnidocbench]" transformers
        # ifeval and causalbench tokenize with nltk's punkt data (docs/evals/ifeval.md).
        python -m nltk.downloader -q punkt punkt_tab

    # One resolve holds every declared extra: a requirement pip had to leave unmet would mean
    # the tests ran against a set no user can install.
    - name: Check the installed set is consistent
      run: python -m pip check

    # pytest reports collection errors on stdout: the whole report is printed when collection
    # fails, only its summary line when it passes.
    - name: Collect the tests (any collection error fails here)
      run: |
        log="$RUNNER_TEMP/collect.log"
        if ! python -m pytest --collect-only -q -p no:cacheprovider > "$log" 2>&1; then
          cat "$log"
          exit 1
        fi
        tail -n 1 "$log"

    - name: Run unit tests
      # testpaths in pyproject.toml scopes collection to tests/, so
      # nothing under gbench/golden_dataset/ is run. ci_skip_gate
      # (scripts/ci_skip_gate.py) fails the run on a skip caused by a
      # missing declared dependency; -rs lists every skip and its reason.
      env:
        PYTHONPATH: scripts
      run: python -m pytest -p ci_skip_gate --skip-gate-extras dev,evals,omnidocbench -rs -p no:cacheprovider

  # Single stable check to require in branch protection. Requiring the
  # matrix legs by name means editing the rule every time the Python
  # version list changes, and a leg that stops being produced silently
  # stops being enforced.
  unit-tests:
    if: always()
    needs: pytest
    runs-on: ubuntu-latest
    steps:
    - name: Verify unit tests passed
      run: |
        if [ "${{ needs.pytest.result }}" != "success" ]; then
          echo "Unit tests did not pass: ${{ needs.pytest.result }}"
          exit 1
        fi
        echo "Unit tests passed on all Python versions."
