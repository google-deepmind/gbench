# vLLM on a GKE GPU node pool, for scripts/eval_cluster.sh (docs/distributed-gbench.md).
#
# Model-agnostic: nothing below names a model or a model's serving recipe. The container runs
#   vllm serve "$MODEL_NAME" --tensor-parallel-size "$TENSOR_PARALLEL_SIZE"
#       --data-parallel-size "$DATA_PARALLEL_SIZE" --gpu-memory-utilization 0.95
#       --enable-chunked-prefill --disable-custom-all-reduce --port 8000
#       [--max-model-len "$MAX_MODEL_LEN"]
#       [--enable-auto-tool-choice --tool-call-parser "$TOOL_CALL_PARSER"]
#       [--reasoning-parser "$REASONING_PARSER"]   (unless it is empty or `none`: the model
#                                                   has no reasoning parser)
#       $VLLM_SERVE_ARGS   (shell-quoted words, split with shlex; e.g. the model's recipe:
#                           --trust-remote-code, --limit-mm-per-prompt '{"image": 8}', ...)
# MAX_MODEL_LEN unset serves the model's native context. eval_cluster.sh sets every variable
# with `kubectl set env` (and the image with `kubectl set image`) before it scales the
# deployment; set them the same way to use the manifest by hand. VLLM_SERVE_ARGS may not repeat
# an argument set above (the model, --port, --host, the parallel sizes, --max-model-len, the
# parsers, --served-model-name, --api-key, --hf-token), or an abbreviation of one such as
# --max-model (vLLM's parser accepts one): the container exits with an error.
#
# The image is pinned (tag and digest, multi-arch: amd64 and arm64), checked on Docker Hub on
# 2026-09-28. Use another pinned tag or digest with eval_cluster.sh --image.
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: vllm
  ports:
  - name: http
    port: 8000
    targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-deployment
spec:
  replicas: 0 # Starts at 0 replicas (no GPU cost); eval_cluster.sh scales it once configured
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      hostIPC: true # NVLink shared memory / multi-GPU IPC
      tolerations:
      - key: "nvidia.com/gpu" # Tolerates any NVIDIA GPU taint
        operator: "Exists"
        effect: "NoSchedule"
      - key: "kubernetes.io/arch" # Tolerates both arm64 (Grace Blackwell) and amd64 (x86_64) taints
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
        imagePullPolicy: IfNotPresent
        command: ["python3", "-c"]
        args:
        - |
          import os, shlex, sys
          env = os.environ
          model = env.get("MODEL_NAME", "").strip()
          if not model:
              sys.exit("MODEL_NAME is not set (eval_cluster.sh sets it with kubectl set env)")
          owned = {"--port", "--host", "--tensor-parallel-size", "-tp",
                   "--data-parallel-size", "-dp", "--max-model-len",
                   "--enable-auto-tool-choice", "--tool-call-parser", "--reasoning-parser",
                   "--served-model-name", "--api-key", "--hf-token", "--model", "--config"}
          extra = shlex.split(env.get("VLLM_SERVE_ARGS", ""))
          for tok in extra:
              if not tok.startswith("-") or tok in ("-", "--"):
                  continue
              name = tok.split("=", 1)[0]
              if name.startswith("--"):
                  name = "--" + name[2:].replace("_", "-")
              hit = name if name in owned else None
              if hit is None and name.startswith("--") and len(name) > 3:
                  # vLLM's parser accepts an unambiguous prefix of a long option
                  hit = next((k for k in sorted(owned) if k.startswith(name)), None)
                  if hit:
                      name = f"{name} (an abbreviation of {hit})"
              if hit:
                  sys.exit(f"VLLM_SERVE_ARGS may not set {name}: it has its own variable")
          argv = ["vllm", "serve", model,
                  "--tensor-parallel-size", env.get("TENSOR_PARALLEL_SIZE") or "1",
                  "--data-parallel-size", env.get("DATA_PARALLEL_SIZE") or "1",
                  "--gpu-memory-utilization", "0.95",
                  "--enable-chunked-prefill", "--disable-custom-all-reduce",
                  "--port", "8000"]
          if env.get("MAX_MODEL_LEN", "").strip():
              argv += ["--max-model-len", env["MAX_MODEL_LEN"].strip()]
          if env.get("TOOL_CALL_PARSER", "").strip():
              argv += ["--enable-auto-tool-choice",
                       "--tool-call-parser", env["TOOL_CALL_PARSER"].strip()]
          reasoning = env.get("REASONING_PARSER", "").strip()
          if reasoning and reasoning.lower() != "none":
              argv += ["--reasoning-parser", reasoning]
          argv += extra
          print("serving: " + shlex.join(argv), flush=True)
          os.execvp(argv[0], argv)
        env:
        - name: MODEL_NAME
          value: "" # set by eval_cluster.sh (the --models id)
        - name: TENSOR_PARALLEL_SIZE
          value: "1"
        - name: DATA_PARALLEL_SIZE
          value: "4" # TENSOR_PARALLEL_SIZE x DATA_PARALLEL_SIZE = the GPUs requested below
        - name: MAX_MODEL_LEN
          value: "" # empty: the model's native context
        - name: TOOL_CALL_PARSER
          value: "" # the model's vLLM tool-call parser, when tool-calling evals run
        - name: REASONING_PARSER
          value: "" # the model's vLLM reasoning parser (`none`: it has none); thinking runs need it
        - name: VLLM_SERVE_ARGS
          value: "" # any other `vllm serve` arguments of the model's recipe (no default)
        - name: HF_HOME
          value: "/root/.cache/huggingface"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: token
              optional: true
        - name: NCCL_NVLS_ENABLE
          value: "0" # Disables NVLS multicast on GKE virtualized GPU instances
        - name: NCCL_DEBUG
          value: "INFO"
        - name: NCCL_SOCKET_IFNAME
          value: "eth0,lo"
        resources:
          limits:
            nvidia.com/gpu: "4"
            memory: "350Gi"
          requests:
            nvidia.com/gpu: "4"
            memory: "250Gi"
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: hf-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
      - name: hf-cache
        hostPath:
          path: /var/cache/huggingface # Container-Optimized OS writable host directory
          type: DirectoryOrCreate
